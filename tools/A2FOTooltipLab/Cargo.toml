[package]
name = "a2fo_tooltiplab"
version = "0.1.0"
edition = "2021"
description = "Mod-aware Fleet Operations Dynamic_Localized_Strings editor"

[dependencies]
anyhow = "1.0"
bevy = { version = "0.13.2", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "multi-threaded",
    "png",
    "jpeg",
    "tga",
    "dds",
    "x11",
] }
bevy_egui = "0.27.1"
image = { version = "0.24.9", default-features = false, features = ["png", "tga"] }
rfd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
