; MERGE this section into the existing A2FORenderer.ini on a backed-up test install.
; Preserve existing [Renderer], [Effects], [Compatibility] and [Diagnostics].
; Absence of this section keeps the legacy path completely unhooked.
[D3D8Compat]
Backend=d3d8
Trace=0
MaxEvents=8192
DebugLayer=0

; Trace=1 records bounded API diagnostics while keeping the native provider.
; It also records up to 64 shader creations, bounded to 4096 DWORDs per stream.
; Unsupported/unreadable payloads are marked explicitly; the game call continues.
; Backend=d3d11-probe presents one SM5 test triangle in the native window,
; then returns to D3D8. Windowed/borderless only; fully restart to change mode.
; Its compiled shaders are cached beneath LOCALAPPDATA/A2FOExtensions/ShaderCache.
; A full Backend=d3d11 renderer is not implemented and is explicitly refused.
