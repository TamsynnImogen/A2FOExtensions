[mod]
Name=Fleet Operations: Nexus
Description=A2FOExtensions showcase. Federation tactical systems: directional shields, torpedo logistics, launcher arcs, crew identities and selected-ship telemetry. Prototype 0.2.
Author=Blade/Apoclaydon; original Fleet Operations by DOCa Cola, Optec, Activision, Maddoc, JanB
Version=0.2.0
AssetVersion=50000
ParentMod="Fleet Ops 4.0"
standalone=0
ignoreParentMaps=0
Screenshot=splash.png
SettingsDirectory="A2FO Nexus"

[modules]
; Mechanics below are mandatory for this mod. Restart after changes.
required0 = "A2FOInfoIni"
required1 = "A2FOFeaturePack"
required2 = "A2FOBuildTooltips"
required3 = "A2FOCraftIdentity"
required4 = "A2FODirectionalShields"
required5 = "A2FOEnergySystems"
required6 = "A2FOFireArcs"
required7 = "A2FOResources"
required8 = "A2FOWeaponDamageControls"

; Retain the other applicable FO4 parent selections.
active0 = "A2FOAlwaysShowShields"
active1 = "A2FOAnimatedHardpoints"
active2 = "A2FOCheats"
active3 = "A2FOHybridBuild"
active4 = "A2FOInstantActionSettings"
active5 = "A2FOMissionSelector"
active6 = "A2FONebulaRenderer"
active7 = "A2FONormalWeaponTech"
active8 = "A2FOPointDefenseCycles"
active9 = "A2FORGBTextures"
active10 = "A2FOSwarmSystem"
active11 = "A2FOTextureVariants"
active12 = "A2FOTurrets"
