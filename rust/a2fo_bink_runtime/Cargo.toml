[package]
name = "a2fo-bink-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "a2fo_bink_runtime"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Unaccepted pixel-packing experiment; ordinary/private core builds leave it off.
rgb16-evaluation = []

[dependencies]
a2fo-bink-candidate = { path = "../a2fo_bink_candidate" }
infinitier_bik_decoder = { path = "../../third_party/rust-bink-evaluation/infinitier_bik_decoder" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

